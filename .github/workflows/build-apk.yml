name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Add AdMob App ID to AndroidManifest
        run: |
          sed -i 's#</application>#        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9612096979718972~9249690006"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - run: mkdir -p assets && cp icon-only.png assets/icon-only.png
      - run: npx @capacitor/assets generate --android --iconBackgroundColor "#0e9f6e" --iconBackgroundColorDark "#0e9f6e"
        continue-on-error: true
      - name: Use the tracker app as the APK start page
        run: |
          cp www/app.html www/index.html
          rm -f www/taka-track-ad.mp4 www/*.apk
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/a.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/ks.jks --ks-pass pass:${{ secrets.KS_PASS }} --ks-key-alias masik --out masik-hisab.apk $RUNNER_TEMP/a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: masik-hisab-apk
          path: masik-hisab.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" masik-hisab.apk --title "TakaTrack build ${{ github.run_number }}" --notes "TakaTrack Android APK" --latest || gh release upload "$TAG" masik-hisab.apk --clobber
